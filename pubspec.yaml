name: academy_management_system
description: "Academy Management System App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.1.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔥 DATABASE
  supabase_flutter: ^2.3.4

  # 📸 IMAGE PICKER
  image_picker: ^1.1.1

  # 📄 PDF
  pdf: ^3.11.0
  printing: ^5.12.0

  # 📁 FILE SYSTEM
  path_provider: ^2.1.2
  open_filex: ^4.4.0
  share_plus: ^10.0.0

  # 📅 DATE FORMAT
  intl: ^0.18.1

  # 📊 CHARTS
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true